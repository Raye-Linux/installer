# Raye Linux installer: Raye Setup, one question per page like Windows 11
# setup. Language, country or region, keyboard, network, disk, device
# name, (Raye account, hidden for now), account, privacy, desktop, then
# install.
#
# The positions in the show sequence matter: branding/raye/strings.js
# (steps) names them in this order for the stages of the top bar, and
# tests/test_branding.py checks the two agree.
---
# Our own in /usr/lib/calamares/modules, then the stock ones. The first one
# found under a name wins, and ours come first for modules/bootloader.
modules-search: [ /usr/lib/calamares/modules, local ]

instances:
- id: raye_network
  module: notesqml
  config: notesqml_raye_network.conf
- id: raye_disk
  module: notesqml
  config: notesqml_raye_disk.conf
- id: raye_device
  module: notesqml
  config: notesqml_raye_device.conf
- id: raye_account
  module: notesqml
  config: notesqml_raye_account.conf
- id: raye_privacy
  module: notesqml
  config: notesqml_raye_privacy.conf
- id: raye_desktop
  module: notesqml
  config: notesqml_raye_desktop.conf
- id: raye_initrd
  module: shellprocess
  config: shellprocess_raye_initrd.conf
- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf
- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf
- id: raye_efi
  module: shellprocess
  config: shellprocess_raye_efi.conf
- id: raye_grub
  module: shellprocess
  config: shellprocess_raye_grub.conf
- id: raye_safe_graphics
  module: shellprocess
  config: shellprocess_raye_safe_graphics.conf
- id: raye_drivers
  module: shellprocess
  config: shellprocess_raye_drivers.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
- id: prepare
  module: rayekeep
  config: rayekeep_prepare.conf
- id: copy
  module: rayekeep
  config: rayekeep_copy.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - notesqml@raye_network
  - notesqml@raye_disk
  - notesqml@raye_device
  - notesqml@raye_account
  - usersq
  - notesqml@raye_privacy
  - notesqml@raye_desktop
  - summaryq
- exec:
  - rayedisk
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - luksbootkeyfile
  - rayekeep@prepare
  - usersq
  - rayekeep@copy
  - rayeencryption
  - displaymanager
  - networkcfg
  - hwclock
  - rayesetupchoices
  - shellprocess@raye_initrd
  - shellprocess@fixconkeys_part1
  - shellprocess@fixconkeys_part2
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@raye_safe_graphics
  - shellprocess@raye_grub
  - shellprocess@raye_efi
  - packages
  - rayedesktop
  - shellprocess@raye_drivers
  - shellprocess@logs
  - umount
- show:
  - finishedq

branding: raye
# the summary's Install button is the question, as in Windows setup
prompt-install: false
dont-chroot: false
oem-setup: false
# closing Setup is the "Quit Setup?" box of the top bar, which restarts
# or shuts the PC down: Calamares' own Cancel question never shows
disable-cancel: true
disable-cancel-during-exec: true
quit-at-end: false
