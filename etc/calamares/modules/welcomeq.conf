---
# Raye's own page (branding/raye/welcomeq.qml): the language, and the
# requirements below, shown only when they fail.
qmlSearch: branding

showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

# No internet check here: the third step connects (Wi-Fi or cable) and
# follows the connection live. A check at start runs once, often before a
# cable has its address, and warned about a network that was fine.
requirements:
    requiredStorage: 25
    requiredRam: 2.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage

geoip:
    style: "none"
