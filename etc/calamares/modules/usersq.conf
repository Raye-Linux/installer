---
# Raye's own page (branding/raye/usersq.qml)
qmlSearch: branding

doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo

passwordRequirements:
    minLength: 6
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-${product}"

user:
  shell: /bin/bash
  forbidden_names: [ root, daemon, bin, sys, sync, games, man, lp, mail,
                     news, uucp, proxy, www-data, backup, list, irc, apt,
                     nobody, messagebus, syslog, sddm, polkitd, rtkit,
                     colord, geoclue, avahi, saned, cups-pk-helper,
                     fwupd-refresh, installer ]
