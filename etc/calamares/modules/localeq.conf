---
# Our own page (branding/raye/localeq.qml): Wi-Fi, then the time zone
# from the network. These values are used when there is no network.
qmlSearch: branding
region: "America"
zone: "Toronto"
localeGenPath: "/etc/locale.gen"
adjustLiveTimezone: true

# No look-up at start: Calamares does it with a blocking request while its
# pages load on other threads, which crashed it now and then. The region
# page asks the same service itself, without blocking, when it first shows.
geoip:
    style: "none"
