---
# The signed boot loader looks for its files in EFI/ubuntu, so the
# folder keeps that name. raye-efi-entry renames the firmware menu entry
# to "Raye Linux" right after.
efiBootLoader: "grub"
timeout: "0"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
installEFIFallback: false
