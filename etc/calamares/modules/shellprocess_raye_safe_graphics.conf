---
# Keep nomodeset on the installed system when the install USB was started
# with "Safe graphics" (see /usr/libexec/raye-safe-graphics). It runs in
# the new system, where /proc/cmdline is still the live session's.
#
# The "-" lets the install carry on if update-grub fails: the menu the
# bootloader step wrote still starts the computer, it has a "Raye Linux
# (safe graphics)" entry, and the next kernel update reads the drop-in.
dontChroot: false
timeout: 120
script:
    - "-/usr/libexec/raye-safe-graphics"
