extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /run/systemd/resolve
      mountPoint: /run/systemd/resolve
      options: [ bind ]
    - device: /cdrom
      mountPoint: /cdrom
      options: [ bind ]

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: ext4
      ssdOptions: [ discard ]
    - filesystem: jfs
      ssdOptions: [ discard ]
    - filesystem: xfs
      ssdOptions: [ discard ]
    - filesystem: swap
      ssdOptions: [ discard ]

# Root on btrfs: one subvolume each for the system, home, logs and cache,
# so snapshots of the system leave the rest alone.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@cache
btrfsSwapSubvol: /@swap

