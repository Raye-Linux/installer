---
# Plain names in the boot menu of the machine we just installed.
#
# The bootloader module writes grub.cfg by calling grub-mkconfig itself,
# so it does not go through Raye's update-grub: on a machine with another
# system on it, the first boot menu a person sees would carry
# os-prober's wording, "Windows Boot Manager (on /dev/nvme0n1p1)". Every
# later kernel update goes through the wrapper.
#
# The "-" lets the install carry on if the pass fails: a menu with the
# plumbing in its names still starts the computer.
dontChroot: false
timeout: 60
script:
    - "-/usr/libexec/raye-grub-titles"
